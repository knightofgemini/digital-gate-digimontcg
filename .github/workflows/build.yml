name: Sito e APK
# Pubblicazione (novembre 2026: l'app è quella React Native di rn/, la vecchia app è nell'etichetta "vecchia-app").
# A ogni invio su main, e quando lo avvia un altro flusso (es. spoiler.yml con le carte nuove):
# - deposito su GitHub Pages (tools/build.py e gli script delle immagini): pagina per scaricare l'APK, carte e prodotti
#   in dati/ (l'app li scarica da sola), immagini, banner, confezioni e loghi, copia del motore della scansione;
# - APK nella release "latest" solo se è cambiata l'app (rn/, icone, chiave, questo flusso o apk.yml) o se lo si chiede
#   avviandolo a mano: per le sole carte nuove non serve un APK nuovo (e niente avviso di aggiornamento ogni giorno).
# Il nome del file resta build.yml: il numero di run è il numero di build dell'APK (cambiando nome ripartirebbe da 1).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apk: { description: "Costruisci e pubblica anche l'APK", type: boolean, default: false }
      prova: { description: "Solo prova: costruisce senza pubblicare (sito e release restano come sono)", type: boolean, default: false }
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: build-${{ github.ref }}
  # in coda, senza interrompere: un controllo degli spoiler non deve fermare un APK a metà
  cancel-in-progress: false
jobs:
  cosa:
    runs-on: ubuntu-latest
    outputs: { apk: "${{ steps.c.outputs.apk }}" }
    steps:
      - uses: actions/checkout@v4
      - id: c
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then echo "apk=${{ inputs.apk }}" >> $GITHUB_OUTPUT; exit 0; fi
          B="${{ github.event.before }}"
          if [ -z "$B" ] || [ "$B" = "0000000000000000000000000000000000000000" ] || ! git fetch -q --depth=1 origin "$B"; then
            echo "apk=true" >> $GITHUB_OUTPUT; exit 0
          fi
          git diff --name-only "$B" HEAD | tee /tmp/cambiati.txt
          if grep -qE '^(rn/|android-res/|android-keys/|\.github/workflows/(build|apk)\.yml$)' /tmp/cambiati.txt; then echo "apk=true" >> $GITHUB_OUTPUT; else echo "apk=false" >> $GITHUB_OUTPUT; fi
      - run: echo "::notice title=APK::${{ steps.c.outputs.apk == 'true' && 'costruito e pubblicato (app cambiata)' || 'non serve (solo dati)' }}"
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: www/img
          # una cache nuova a ogni build: così si conservano anche le immagini senza SAMPLE sostituite (www/img/sample.json)
          key: img-v1-${{ hashFiles('src/data.json', 'src/errata/*') }}-${{ github.run_id }}
          restore-keys: img-v1-
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install pillow numpy   # numpy: ritaglio delle anteprime degli spoiler (tools/spoiler_trim.py)
      - run: node rn/scripts/ocr-files.js
      - run: python3 tools/build.py
      - run: python3 tools/fetch_images.py
      - run: python3 tools/fetch_banners.py
      - run: python3 tools/fetch_product_images.py
      - run: python3 tools/apply_errata_images.py
      - run: python3 tools/img_versions.py   # img/v.json: immagini cambiate (il telefono le riscarica)
      - name: Riepilogo del deposito
        run: |
          { echo "### Deposito"; for d in www/*; do echo "- $(basename $d): $(find $d -type f | wc -l) file, $(du -sh $d | cut -f1)"; done; echo; cat www/dati/ver.json; } >> $GITHUB_STEP_SUMMARY
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
  deploy:
    needs: web
    if: ${{ !inputs.prova }}
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  apk:
    needs: cosa
    if: ${{ needs.cosa.outputs.apk == 'true' }}
    uses: ./.github/workflows/apk.yml
    with: { tipo: latest }
    secrets: inherit
  release:
    # dopo il sito: l'APK nuovo trova già online immagini e dati delle sue carte
    needs: [deploy, apk]
    if: ${{ !inputs.prova && needs.apk.result == 'success' }}
    runs-on: ubuntu-latest
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: apk }
      # una volta sola: l'ultimo APK della vecchia app (build 126) resta scaricabile nella release "vecchia-app"
      - name: Archivio dell'APK della vecchia app
        run: |
          if gh release view vecchia-app --repo "${{ github.repository }}" >/dev/null 2>&1; then echo "archivio già presente"; exit 0; fi
          N=$(gh release view latest --repo "${{ github.repository }}" --json name -q .name | grep -oE '[0-9]+$' || echo 0)
          if [ "$N" -gt 0 ] && [ "$N" -le 126 ]; then
            mkdir -p vecchia && gh release download latest --repo "${{ github.repository }}" -p DigimonSetTracker.apk -D vecchia
            mv vecchia/DigimonSetTracker.apk vecchia/DigitalGate-vecchia-app.apk
            gh release create vecchia-app vecchia/DigitalGate-vecchia-app.apk --repo "${{ github.repository }}" --latest=false \
              --target cc7b1ed9a8fb7e55a856ca41fa2dd02f7afa3ae9 --title "Vecchia app (archivio) · build $N" \
              --notes "Ultima versione della vecchia app (HTML + Capacitor), conservata in archivio. Il codice è nell'etichetta vecchia-app; come funzionava: docs/vecchia-app.md."
          fi
      - name: Pubblica l'APK nella release "latest"
        run: |
          gh release delete latest --repo "${{ github.repository }}" --yes --cleanup-tag || true
          sleep 5
          gh release create latest DigimonSetTracker.apk --repo "${{ github.repository }}" --title "APK più recente · build ${{ needs.apk.outputs.vc }}" --notes "Scarica DigimonSetTracker.apk e installalo sul telefono. build: ${{ needs.apk.outputs.vc }}" --target "${{ github.sha }}"
          sleep 5
          gh release edit latest --repo "${{ github.repository }}" --draft=false || true
          gh release view latest --repo "${{ github.repository }}" --json isDraft,name
