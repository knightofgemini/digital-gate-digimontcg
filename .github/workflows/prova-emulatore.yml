name: Prova su emulatore
# Anteprima senza pubblicare: compila l'APK dell'app (solo x86_64, per l'emulatore), lo avvia su un emulatore Android 14
# e fotografa le schede carta indicate. Le foto vanno nel ramo "rn-shots"; nessuna release viene toccata.
# Si avvia a ogni invio sul ramo rn-tag (le carte da fotografare sono in tools/rn_shots.txt) o a mano da qualsiasi ramo;
# con "scansione" (o inviando sul ramo rn-scan) prova invece la scansione senza rete (tools/rn_scan.py: motore di
# lettura dall'APK e una foto). Con "novita" (o inviando sul ramo rn-novita) prova il riquadro "Carte nuove"
# (tools/rn_news.py): l'APK ha i dati di prima degli spoiler del 3 novembre 2026, così all'apertura scarica quelli del sito.
# Con "home" fotografa la Home (tools/rn_home.py: temi chiaro e scuro, collezione vuota e piena, senza rete, larghezze
# 320/360/430 dp, testo ingrandito e collegamenti principali; di solito solo la prova rapida, tutto con "completa").
on:
  push:
    branches: [rn-tag, rn-scan, rn-novita]
    paths: ["rn/**", "tools/rn_shots*", "tools/rn_gestures.py", "tools/rn_mazzo.py", "tools/rn_news.py", "tools/rn_home.py", ".github/workflows/prova-emulatore.yml"]
  workflow_dispatch:
    inputs:
      scansione: { description: "Prova della scansione senza rete al posto delle foto delle carte", type: boolean, default: false }
      novita: { description: "Prova del riquadro Carte nuove (APK con dati vecchi)", type: boolean, default: false }
      home: { description: "Foto della Home al posto delle foto delle carte (rapida: tema scuro, pagina intera, banner)", type: boolean, default: false }
      completa: { description: "Con home: prova completa (senza rete, collezione vuota, tema chiaro, collegamenti, larghezze)", type: boolean, default: false }
permissions:
  contents: write
concurrency:
  group: prova-emulatore-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: rn/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
        working-directory: rn
      - name: Controllo dei tipi (TypeScript)
        working-directory: rn
        run: |
          if npx tsc --noEmit > /tmp/tsc.txt 2>&1; then echo "TSC OK" >> /tmp/tsc.txt; else echo "TSC ERRORI" >> /tmp/tsc.txt; fi
          tail -40 /tmp/tsc.txt
      - name: Dati vecchi per la prova del riquadro "Carte nuove"
        if: ${{ inputs.novita || github.ref_name == 'rn-novita' }}
        run: |
          git fetch -q --depth=1 origin 83c5b989cc0832526dde40e7db1bc228af25b84d
          git show FETCH_HEAD:src/data.json > src/data.json
          echo "DATA_T=$(git log -1 --format=%ct FETCH_HEAD)" >> $GITHUB_ENV
      - run: node scripts/sync-data.js
        working-directory: rn
      - run: node scripts/ocr-files.js
        working-directory: rn
      - run: npx expo prebuild --platform android --clean --no-install
        working-directory: rn
      - name: Firma e architettura dell'emulatore
        working-directory: rn
        run: |
          cp ../android-keys/debug.keystore android/app/debug.keystore
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\norg.gradle.caching=true\nreactNativeArchitectures=x86_64\n' >> android/gradle.properties
      # lavoro già fatto dalle build precedenti (7 novembre 2026, per accorciare i tempi): file scaricati da Gradle,
      # risultati riutilizzabili di Gradle (org.gradle.caching) e parti in C++ già compilate (ccache, usato da CMake
      # tramite CMAKE_*_COMPILER_LAUNCHER). La chiave cambia a ogni run, così si salva sempre l'ultima versione e si
      # riparte dalla più recente (restore-keys).
      - name: Strumenti per riusare il lavoro già fatto
        run: |
          sudo apt-get install -y -qq ccache > /dev/null
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "CCACHE_NOHASHDIR=true" >> $GITHUB_ENV
          echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=2G" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.ccache
          key: gradle-x86-${{ hashFiles('rn/package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            gradle-x86-${{ hashFiles('rn/package-lock.json') }}-
            gradle-x86-
      - name: Build APK
        working-directory: rn/android
        run: |
          set -o pipefail
          ccache -z > /dev/null
          chmod +x gradlew && ./gradlew assembleRelease --no-daemon 2>&1 | tail -40 | tee /tmp/gradle.txt
          ccache -s | tee -a /tmp/gradle.txt
      - run: cp rn/android/app/build/outputs/apk/release/app-release.apk prova.apk
      - name: Foto di una carta per la prova della scansione
        if: ${{ inputs.scansione || github.ref_name == 'rn-scan' }}
        run: pip install pillow && python3 -c "from PIL import Image; Image.open('src/errata/BT10-086.webp').convert('RGB').save('carta.jpg', quality=92)"
      - name: KVM per l'emulatore
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      # emulatore già acceso una volta e salvato (7 novembre 2026): le prove successive ripartono da lì, più in fretta
      - uses: actions/cache@v4
        id: avd
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-pixel_6
      - name: Emulatore da salvare (solo la prima volta)
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "emulatore salvato"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          script: adb install -r prova.apk && if [ "${{ inputs.home }}" = "true" ]; then HOME_COMPLETA=${{ inputs.completa && '1' || '0' }} python3 tools/rn_home.py foto; elif [ "${{ inputs.novita || github.ref_name == 'rn-novita' }}" = "true" ]; then python3 tools/rn_news.py foto; elif [ "${{ inputs.scansione || github.ref_name == 'rn-scan' }}" = "true" ]; then python3 tools/rn_scan.py foto; else python3 tools/rn_shots.py foto "$(cat tools/rn_shots.txt)" && python3 tools/rn_gestures.py foto; python3 tools/rn_mazzo.py foto; fi
      - name: Foto nel ramo rn-shots
        if: always()
        run: |
          mkdir -p foto && cp /tmp/tsc.txt foto/ 2>/dev/null || true; cp /tmp/gradle.txt foto/ 2>/dev/null || true
          echo "${{ github.sha }}" > foto/sha.txt
          cd foto && git init -q && git add -A && git -c user.name=Claude -c user.email=noreply@anthropic.com commit -qm "foto ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/rn-shots
