name: Pulizia rami
# Pulizia una tantum (novembre 2026, richiesta dell'utente): da qui Claude non può cancellare rami, quindi lo fa questo
# flusso, avviato a mano dall'utente (Actions → Pulizia rami → Run workflow).
# - Restano i rami che servono ai flussi automatici (RESTANO) e main.
# - I rami già confluiti in main si cancellano: il loro contenuto è tutto in main, non si perde niente.
# - Gli esperimenti mai usati (ARCHIVIO) diventano etichette "archivio/<nome>" e poi si cancellano: si possono
#   sempre ritrovare tra le etichette (tag) del repository.
# - Qualsiasi altro ramo non confluito resta dov'è (potrebbe essere un lavoro in corso) e viene solo elencato.
# - Etichetta "vecchia-app" sull'ultima versione pubblicata della vecchia app, se non c'è già.
# Con "prova" scrive soltanto cosa farebbe. Dopo la pulizia vera questo file si può togliere da main (un flusso non
# può modificare i file dei flussi: lo toglie Claude).
on:
  workflow_dispatch:
    inputs:
      prova: { description: "Solo prova: elenca cosa farebbe, senza cancellare niente", type: boolean, default: false }
permissions:
  contents: write
concurrency: { group: pulizia, cancel-in-progress: false }
jobs:
  pulizia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Pulizia
        shell: bash
        env:
          PROVA: ${{ inputs.prova }}
          RESTANO: "main prezzi set-assets spoiler-stato analysis-out rn-check rn-shots"
          ARCHIVIO: "elenco-v2 filtri-multipli griglia-capsule griglia-riga preferiti-v2 probe-apk probe-formati probe-ritaglio scansione una-loghi spoiler-nuove spoiler-nuove-prova spoiler-stato-prova spoiler-test spoiler-auto-prova"
          VECCHIA: cc7b1ed9a8fb7e55a856ca41fa2dd02f7afa3ae9
        run: |
          set -e
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git fetch -q --tags origin '+refs/heads/*:refs/remotes/origin/*'
          S=$GITHUB_STEP_SUMMARY; [ "$PROVA" = "true" ] && echo "## Solo prova: niente è stato cancellato" >> $S
          fai() { if [ "$PROVA" = "true" ]; then echo "(prova) $*"; else "$@" || echo "non riuscito: $*"; fi; }
          if ! git rev-parse -q --verify refs/tags/vecchia-app >/dev/null; then
            fai git push -q origin "$VECCHIA:refs/tags/vecchia-app"; echo "- etichetta **vecchia-app** creata" >> $S
          fi
          canc=(); arch=(); resta=()
          for b in $(git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/origin | grep -v '^HEAD$'); do
            if [[ " $RESTANO " == *" $b "* ]]; then continue; fi
            if git merge-base --is-ancestor "origin/$b" origin/main; then canc+=("$b")
            elif [[ " $ARCHIVIO " == *" $b "* ]]; then arch+=("$b")
            else resta+=("$b"); fi
          done
          for b in "${arch[@]}"; do
            fai git push -q origin "refs/remotes/origin/$b:refs/tags/archivio/$b"
            fai git push -q origin --delete "$b"
          done
          for b in "${canc[@]}"; do fai git push -q origin --delete "$b"; done
          {
            echo "### Cancellati (già in main): ${#canc[@]}"; printf -- '- %s\n' "${canc[@]}"
            echo "### Archiviati come etichette archivio/…: ${#arch[@]}"; printf -- '- %s\n' "${arch[@]}"
            echo "### Lasciati (non confluiti, non in elenco): ${#resta[@]}"; printf -- '- %s\n' "${resta[@]}"
          } >> $S
          cat $S
