name: Nuova app (React Native) - APK di prova
# APK di prova della nuova app (cartella rn/, ramo react-native). Stesso nome del pacchetto e stessa chiave dell'APK attuale,
# così si installa sopra; versionCode = stesso numero della build attuale (Android accetta l'installazione nei due sensi:
# si può tornare all'APK attuale senza disinstallare). Pubblicato solo nella release "rn-prova" (pre-release):
# la release "latest", il sito e l'APK attuale non vengono toccati.
on:
  push:
    branches: [react-native]
    paths: ["rn/**", ".github/workflows/rn-apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rn-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: rn/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # prezzi più recenti (ramo "prezzi"); se manca resta src/prices.json
      - run: git fetch -q --depth=1 origin prezzi && git show FETCH_HEAD:prices.json > /tmp/p.json && mv /tmp/p.json src/prices.json || echo "ramo prezzi non disponibile"
      - run: npm ci
        working-directory: rn
      # controllo dei tipi: il risultato va nel ramo "rn-check" (leggibile anche da fuori), non ferma la build
      - name: Controllo dei tipi (TypeScript)
        working-directory: rn
        run: |
          if npx tsc --noEmit > /tmp/tsc.txt 2>&1; then echo "TSC OK" >> /tmp/tsc.txt; else echo "TSC ERRORI" >> /tmp/tsc.txt; fi
          tail -40 /tmp/tsc.txt
      - run: node scripts/sync-data.js
        working-directory: rn
      - name: Numero di versione (sopra l'APK pubblicato) e build 0 (niente avviso di aggiornamento nella prova)
        working-directory: rn
        run: |
          LATEST=$(gh release view latest --json name -q .name | grep -oE '[0-9]+$' || echo 0)
          export VC=$((LATEST > 0 ? LATEST : 1))
          echo "VC=$VC" >> $GITHUB_ENV
          node -e '
            const fs = require("fs"), j = JSON.parse(fs.readFileSync("app.json", "utf8"));
            j.expo.android.versionCode = +process.env.VC; j.expo.version = "2.0." + process.env.VC;
            j.expo.extra = Object.assign({}, j.expo.extra, { build: 0 });
            fs.writeFileSync("app.json", JSON.stringify(j, null, 2));
            console.log(j.expo.android, j.expo.version);'
      - run: npx expo prebuild --platform android --clean --no-install
        working-directory: rn
      - name: Icona Digital Gate (la stessa dell'APK attuale) e firma fissa
        working-directory: rn
        run: |
          rm -f android/app/src/main/res/mipmap-*/ic_launcher*.webp   # icone generate da Expo: al loro posto quelle di Digital Gate
          cp -r ../android-res/. android/app/src/main/res/
          cp ../android-keys/debug.keystore android/app/debug.keystore
          grep -n -A6 "signingConfigs" android/app/build.gradle
          # a capo prima: l'ultima riga del file non ne ha uno (altrimenti si attacca alla riga precedente)
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n' >> android/gradle.properties
          # solo le architetture dei telefoni (x86 e x86_64 servono agli emulatori: ~65 MB in meno)
          printf 'reactNativeArchitectures=arm64-v8a,armeabi-v7a\n' >> android/gradle.properties
          tail -4 android/gradle.properties
      - name: Build APK
        working-directory: rn/android
        run: |
          set -o pipefail
          chmod +x gradlew && ./gradlew assembleRelease --no-daemon 2>&1 | tee /tmp/gradle.txt
      - run: cp rn/android/app/build/outputs/apk/release/app-release.apk DigitalGate-prova.apk
      # il servizio di scaricamento in sottofondo deve esserci davvero (prima mancava senza che la build se ne accorgesse)
      - name: Controllo modulo nativo BgDownload
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          unzip -p DigitalGate-prova.apk 'classes*.dex' | grep -a -q "expo/modules/bgdownload/BgDownloadService" || { echo "BgDownloadService non trovato nell'APK" | tee -a /tmp/gradle.txt; exit 1; }
          $BT/aapt dump xmltree DigitalGate-prova.apk AndroidManifest.xml | grep -q "FOREGROUND_SERVICE_DATA_SYNC" || { echo "permessi del servizio mancanti" | tee -a /tmp/gradle.txt; exit 1; }
          ls -la DigitalGate-prova.apk
      - name: Controllo firma (deve essere la stessa chiave dell'APK attuale)
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          GOT=$($BT/apksigner verify --print-certs DigitalGate-prova.apk | grep -m1 "certificate SHA-256 digest" | awk '{print $NF}')
          WANT=$(keytool -list -v -keystore android-keys/debug.keystore -storepass android -alias androiddebugkey | grep -m1 "SHA256:" | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "firma APK: $GOT"; echo "chiave:     $WANT"
          test -n "$GOT" && test "$GOT" = "$WANT"
          $BT/aapt dump badging DigitalGate-prova.apk | head -3
      - name: Release "rn-prova" (pre-release, non tocca "latest")
        run: |
          gh release delete rn-prova --yes --cleanup-tag || true
          sleep 3
          gh release create rn-prova DigitalGate-prova.apk --prerelease --latest=false --title "Nuova app (prova) · versione ${{ env.VC }}" --notes "APK di prova della nuova app React Native. Al primo avvio recupera da sola collezione, preferite e mazzi dell'app attuale; per sicurezza conviene comunque copiare prima il backup (Informazioni → Backup dei tuoi dati)." --target "${{ github.sha }}"
          sleep 3
          gh release edit rn-prova --draft=false --prerelease || true
          gh release view rn-prova --json isDraft,isPrerelease,name
      # esito del controllo dei tipi e (se fallisce) la fine del log della build nel ramo "rn-check"
      - name: Esito nel ramo rn-check
        if: always()
        run: |
          mkdir -p /tmp/chk && cd /tmp/chk && git init -q
          cp /tmp/tsc.txt . 2>/dev/null || echo "tsc non eseguito" > tsc.txt
          tail -300 /tmp/gradle.txt > gradle.txt 2>/dev/null || echo "build non eseguita" > gradle.txt
          echo "${{ github.sha }} ${{ job.status }}" > esito.txt
          git add -A && git -c user.name=Claude -c user.email=noreply@anthropic.com commit -qm "controllo ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/rn-check || true
