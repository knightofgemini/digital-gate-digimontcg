name: Nuove carte (spoiler)
# Ogni giorno controlla nella raccolta TakaOtaku se ci sono carte nuove nei prodotti in arrivo (es. BT27, EX14).
# Pubblicazione automatica con filtro (scelta dell'utente del 31 ottobre 2026): le carte con immagine e testo completo
# vanno su main e si pubblicano subito sul sito (www/dati, che l'app scarica da sola: niente APK nuovo); le altre restano
# in "_hold"/"_hold_versions" di tools/card_fixes.json ed entrano da sole quando sono complete.
# Avviso via mail con l'elenco (segnalazione su GitHub aperta e subito chiusa), una volta sola per le stesse novità
# (stato nel ramo "spoiler-stato"). Con "prova": dati nel ramo "spoiler-auto-prova", niente pubblicazione né avviso.
on:
  workflow_dispatch:
    inputs:
      prova: { description: "Prova: rami con -prova nel nome e nessuna segnalazione", type: boolean, default: false }
      prova_mail: { description: "Manda solo una segnalazione di prova (per controllare che arrivi la mail) e la richiude", type: boolean, default: false }
  schedule:
    - cron: "37 5 * * *"
permissions:
  contents: write
  issues: write
  actions: write   # avvio della pubblicazione (build.yml): i push fatti da qui non la fanno partire da soli
concurrency:
  group: spoiler
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Segnalazione di prova (mail)
        if: inputs.prova_mail
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh issue create --repo "${{ github.repository }}" --title "Prova dell'avviso delle nuove carte spoiler" --body "Questa è una prova: se ti è arrivata la mail, gli avvisi del controllo giornaliero funzionano. @${{ github.repository_owner }}")
          gh issue close "$url" --repo "${{ github.repository }}" --comment "Prova conclusa."
          echo "::notice title=Prova::segnalazione di prova inviata e chiusa: $url"
      - uses: actions/checkout@v4
        if: ${{ !inputs.prova_mail }}
      - name: Scarica la raccolta TakaOtaku
        if: ${{ !inputs.prova_mail }}
        run: git clone -q --depth 1 https://github.com/TakaOtaku/Digimon-Card-App "$RUNNER_TEMP/taka"
      - name: Stato dell'ultimo avviso
        if: ${{ !inputs.prova_mail }}
        id: prev
        shell: bash
        run: |
          if git fetch -q --depth 1 origin spoiler-stato${{ inputs.prova && '-prova' || '' }} 2>/dev/null; then
            echo "ids=$(git show FETCH_HEAD:stato.txt 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
          fi
      - name: Confronta con il catalogo
        if: ${{ !inputs.prova_mail }}
        id: c
        env:
          TAKA: ${{ runner.temp }}/taka
        run: python3 tools/spoiler_check.py --apply --auto --report "$RUNNER_TEMP/report.md" --out "$GITHUB_OUTPUT" --prev "${{ steps.prev.outputs.ids }}"
      - name: Riepilogo
        if: ${{ always() && !inputs.prova_mail }}
        run: cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Pubblica le carte nuove
        if: ${{ !inputs.prova_mail && steps.c.outputs.pubblica == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add src/data.json tools/card_fixes.json
          git diff --cached --quiet && { echo "niente da pubblicare"; exit 0; }
          git commit -qm "Spoiler: carte nuove del $(date +%d/%m/%Y) (pubblicate da sole: con immagine e testo completo)"
          if [ "${{ inputs.prova }}" = "true" ]; then
            git push -q -f origin HEAD:refs/heads/spoiler-auto-prova; echo "Prova: dati nel ramo spoiler-auto-prova"; exit 0
          fi
          for n in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            sleep 10
          done
          gh workflow run build.yml --ref main
          echo "::notice title=Pubblicazione::carte nuove su main, pubblicazione avviata"
      - name: Avviso via mail
        if: ${{ !inputs.prova_mail && !inputs.prova && steps.c.outputs.cambiato == '1' && steps.c.outputs.ids != steps.prev.outputs.ids }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          echo "" >> "$RUNNER_TEMP/report.md"; echo "@${{ github.repository_owner }}" >> "$RUNNER_TEMP/report.md"
          # segnalazione aperta e subito chiusa: arriva la mail, non resta niente da fare
          url=$(gh issue create --repo "${{ github.repository }}" --title "Spoiler del $(date +%d/%m/%Y)" --body-file "$RUNNER_TEMP/report.md")
          gh issue close "$url" --repo "${{ github.repository }}"
      - name: Stato dell'avviso
        if: ${{ !inputs.prova_mail && steps.c.outputs.ids != steps.prev.outputs.ids }}
        env:
          SUF: ${{ inputs.prova && '-prova' || '' }}
        shell: bash
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          d=$(mktemp -d); git worktree add -q --detach "$d"; cd "$d"
          git checkout -q --orphan "spoiler-stato$SUF"; git rm -rqf --ignore-unmatch .
          echo "${{ steps.c.outputs.ids }}" > stato.txt
          git add stato.txt; git commit -qm "Stato del controllo spoiler"; git push -q -f origin "spoiler-stato$SUF"
      - name: Chiudi la vecchia segnalazione "da controllare"
        # prima del 31 ottobre 2026 le carte aspettavano il controllo a mano: ora non serve più
        if: ${{ !inputs.prova_mail && !inputs.prova }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          num=$(gh issue list --repo "${{ github.repository }}" --state open --search "Nuove carte spoiler in:title" --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then gh issue close "$num" --repo "${{ github.repository }}" --comment "Le carte spoiler ora si pubblicano da sole (con immagine e testo completo)."; fi
