// Modulo nativo locale "BgDownload" della nuova app (Expo Modules, SDK 58): servizio in primo piano per "Immagini offline".
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.bgdownload'
version = '1.0.0'

android {
  namespace "expo.modules.bgdownload"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
}
