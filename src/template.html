/* ---- Animazione di avvio: "Digital Gate" (ispirata al varco digitale e al codice digitale di Digimon) */
/* intro Digital Gate (Digivice, 1,9 s): Salta animazione, Esc, movimento ridotto */
.dg-boot{--dg-boot-navy:#0b1120;--dg-boot-orange:#ff7a3d;--dg-boot-cyan:#63d5ee;position:fixed;inset:0;z-index:1000;display:grid;place-items:center;overflow:hidden;background:var(--dg-boot-navy);color:#f1f4f9;isolation:isolate;font-family:var(--font-body,'IBM Plex Sans',system-ui,sans-serif);opacity:0;pointer-events:none;visibility:hidden;}
.dg-boot.is-pending{visibility:visible;opacity:1;pointer-events:auto;}
.dg-boot.is-running{visibility:visible;opacity:1;pointer-events:auto;cursor:pointer;animation:dg-boot-exit 169ms 1066ms ease-out forwards;}
.dg-boot__ambient{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,#17314b 0%,#0b1120 54%);opacity:.88;}
.dg-boot__grid{position:absolute;inset:0;background-image:linear-gradient(#63d5ee0a 1px,transparent 1px),linear-gradient(90deg,#63d5ee0a 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at 50% 46%,#000 4%,transparent 65%);pointer-events:none;}
.dg-boot__content{position:relative;display:flex;align-items:center;flex-direction:column;width:100%;padding:24px;transform:translateY(-10px);}
.dg-boot__portal{position:relative;display:grid;place-items:center;width:240px;height:240px;margin-bottom:25px;}
.dg-boot__ring{position:absolute;inset:0;border:1px solid #63d5ee36;border-radius:50%;opacity:0;}
.dg-boot__ring::before{content:'';position:absolute;inset:-1px;border:5px solid transparent;border-top-color:var(--dg-boot-cyan);border-right-color:var(--dg-boot-cyan);border-radius:50%;transform:rotate(-45deg);}
.dg-boot__ring--outer{inset:-19px;border-color:#ff7a3d35;}
.dg-boot__ring--outer::before{border-top-color:var(--dg-boot-orange);border-right-color:transparent;border-left-color:var(--dg-boot-orange);}
.dg-boot__ring--inner{inset:15px;border-color:#63d5ee1f;}
.dg-boot__ring--inner::before{border-right-color:transparent;}
.dg-boot__mark{position:relative;z-index:2;width:204px;height:204px;display:block;opacity:0;transform:scale(.9);}
.dg-boot__screenlight{position:absolute;z-index:3;width:57px;height:57px;left:calc(50% - 28px);top:calc(50% - 29px);border-radius:50%;background:radial-gradient(circle,#63d5ee26 0%,#63d5ee12 40%,transparent 72%);opacity:0;pointer-events:none;}
.dg-boot__pixel{position:absolute;width:4px;height:4px;background:var(--dg-boot-cyan);opacity:0;--dg-start-x:0px;--dg-start-y:0px;}
.dg-boot__pixel:nth-of-type(3n){background:var(--dg-boot-orange);}
.dg-boot__wordmark{font:700 italic clamp(27px,7vw,40px)/1.1 var(--font-display,'Chakra Petch',system-ui,sans-serif);letter-spacing:.02em;text-align:center;margin:0;opacity:0;transform:translateY(8px);}
.dg-boot__subtitle{font:600 11px/1.5 var(--font-display,'Chakra Petch',system-ui,sans-serif);letter-spacing:.3em;color:var(--dg-boot-cyan);text-align:center;margin:10px 0 0;opacity:0;}
.dg-boot__sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0;}
.dg-boot.is-running .dg-boot__ring{animation:dg-boot-ring 1072ms 0ms cubic-bezier(.2,.8,.2,1) both;}
.dg-boot.is-running .dg-boot__ring--outer{animation-duration:1138ms;animation-delay:26ms;}
.dg-boot.is-running .dg-boot__ring--inner{animation-duration:1027ms;animation-delay:72ms;}
.dg-boot.is-running .dg-boot__mark{animation:dg-boot-mark 942ms 104ms ease-out both;}
.dg-boot.is-running .dg-boot__screenlight{animation:dg-boot-light 812ms 247ms ease-in-out both;}
.dg-boot.is-running .dg-boot__wordmark{animation:dg-boot-word 247ms 494ms cubic-bezier(.2,.8,.2,1) both;}
.dg-boot.is-running .dg-boot__subtitle{animation:dg-boot-subtitle 195ms 611ms ease-out both;}
.dg-boot.is-running .dg-boot__pixel{animation:dg-boot-pixel 494ms var(--dg-delay,0ms) ease-out both;}
@keyframes dg-boot-ring{0%{opacity:0;transform:rotate(-38deg) scale(.76)}20%{opacity:.8}70%{opacity:.72;transform:rotate(26deg) scale(1)}100%{opacity:0;transform:rotate(43deg) scale(1.32)}}
@keyframes dg-boot-mark{0%{opacity:0;transform:scale(.88)}22%{opacity:1;transform:scale(1)}84%{opacity:1;transform:scale(1)}100%{opacity:1;transform:scale(1.04)}}
@keyframes dg-boot-light{0%{opacity:0;transform:scale(.7)}35%{opacity:1;transform:scale(1.3)}70%{opacity:.8;transform:scale(1.1)}100%{opacity:0;transform:scale(2.3)}}
@keyframes dg-boot-word{to{opacity:1;transform:translateY(0)}}
@keyframes dg-boot-subtitle{to{opacity:1}}
@keyframes dg-boot-pixel{0%{opacity:0;transform:translate(var(--dg-start-x),var(--dg-start-y)) scale(1)}16%{opacity:.75}100%{opacity:0;transform:translate(0,0) scale(.2)}}
@keyframes dg-boot-exit{to{opacity:0;visibility:hidden;pointer-events:none}}
@media(max-width:380px){.dg-boot__portal{width:214px;height:214px;margin-bottom:22px}.dg-boot__mark{width:184px;height:184px}.dg-boot__ring--outer{inset:-14px}}
@media(prefers-reduced-motion:reduce){.dg-boot.is-running{animation:none}.dg-boot__ring,.dg-boot__pixel,.dg-boot__screenlight{display:none!important}.dg-boot.is-running .dg-boot__mark,.dg-boot.is-running .dg-boot__wordmark,.dg-boot.is-running .dg-boot__subtitle{animation:none;opacity:1;transform:none}}
/* ==== Desktop (PC con mouse, da 1000 px): barra laterale fissa, pagine a tutta larghezza. Telefono e APK non cambiano. ==== */
/* colori della barra laterale: chiara nel tema chiaro, scura nel tema scuro */
:root { --cyan: #0c7084; --cyan-soft: #e3f3f6; --side: #ffffff; --side-2: #eef2f8; --side-line: #d3dbe8; --side-ink: #0f1a2e; --side-ink2: #6a7891; --side-txt: #2b3a55; --side-ico: #6a7891; --side-hi: #0f1a2e; --side-acc: #e0531a; --side-nb: #e3f3f6; --side-nbt: #0c7084; --side-bar: #e2e8f1; --side-foot: #7a879e; --sidew: 248px; --shadow: 0 8px 24px rgba(15,26,46,.10); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --cyan: #63d5ee; --cyan-soft: #12303a; --side: #0a1020; --side-2: #18233a; --side-line: #1c2843; --side-ink: #e6edf8; --side-ink2: #8d9bb4; --side-txt: #c9d3e4; --side-ico: #8d9bb4; --side-hi: #ffffff; --side-acc: #ff8a4c; --side-nb: #1d3a4d; --side-nbt: #8fe2f4; --side-bar: #0c1424; --side-foot: #6f7d99; --shadow: 0 8px 24px rgba(0,0,0,.35); } }
:root[data-theme="dark"] { --cyan: #63d5ee; --cyan-soft: #12303a; --side: #0a1020; --side-2: #18233a; --side-line: #1c2843; --side-ink: #e6edf8; --side-ink2: #8d9bb4; --side-txt: #c9d3e4; --side-ico: #8d9bb4; --side-hi: #ffffff; --side-acc: #ff8a4c; --side-nb: #1d3a4d; --side-nbt: #8fe2f4; --side-bar: #0c1424; --side-foot: #6f7d99; --shadow: 0 8px 24px rgba(0,0,0,.35); }
.menu .brandrow, .menu .sidetools, .menu nav .grp, .menu nav .nb { display: none; }
body.desk { padding-left: var(--sidew); }
body.desk .menu { left: 0; right: auto; width: var(--sidew); transform: none; background: var(--side); border-left: 0; border-right: 1px solid var(--side-line); color: var(--side-ink); padding: 18px 14px 16px; transition: none; overflow-x: hidden; }
body.desk .menu-scrim, body.desk .burger, body.desk .menu .mh { display: none; }
body.desk .menu .brandrow { display: flex; align-items: center; gap: 6px; padding: 0 0 16px; }
body.desk .menu .brand { flex: 1; min-width: 0; display: flex; align-items: center; gap: 11px; border: 0; background: none; color: inherit; padding: 2px 6px; cursor: pointer; text-align: left; }
body.desk .brand svg { width: 36px; height: 36px; flex: none; }
body.desk .brand b { display: block; white-space: nowrap; font: 700 1.08rem/1.1 var(--font-display); letter-spacing: .07em; text-transform: uppercase; }
body.desk .brand small { display: block; font: 600 .6rem var(--font-display); letter-spacing: .34em; color: var(--side-ink2); }
body.desk .menu .colbtn { flex: none; width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--side-line); background: none; color: var(--side-ico); display: grid; place-items: center; cursor: pointer; padding: 0; }
body.desk .menu .colbtn:hover { background: var(--side-2); color: var(--side-hi); }
body.desk .menu .colbtn svg { width: 18px; height: 18px; }
body.desk .menu nav { gap: 2px; }
body.desk .menu nav .grp { display: block; white-space: nowrap; font: 600 .64rem var(--font-display); letter-spacing: .2em; text-transform: uppercase; color: var(--side-ink2); padding: 16px 12px 6px; }
body.desk .menu nav button { position: relative; white-space: nowrap; color: var(--side-txt); font: 500 .93rem var(--font-body); padding: 10px 12px; border-radius: 9px; }
body.desk .menu nav button svg { color: var(--side-ico); width: 19px; height: 19px; }
body.desk .menu nav button:hover { background: var(--side-2); color: var(--side-hi); }
body.desk .menu nav button[aria-current="page"] { background: var(--side-2); color: var(--side-hi); font-weight: 600; }
body.desk .menu nav button[aria-current="page"]::before { content: ""; position: absolute; left: -14px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: #ff7a3d; }
body.desk .menu nav button[aria-current="page"] svg { color: var(--side-acc); }
body.desk .menu nav .nb { display: inline-block; margin-left: auto; font: 700 .68rem var(--font-display); padding: 2px 7px; border-radius: 6px; background: var(--side-nb); color: var(--side-nbt); }
body.desk .menu .coll { margin-top: auto; background: var(--side-2); border-color: var(--side-line); }
body.desk .menu .coll .count { color: var(--side-ink2); white-space: nowrap; }
body.desk .menu .coll .count b { color: var(--side-acc); font-size: 1.35rem; }
body.desk .menu .progress { background: var(--side-bar); }
body.desk .menu .sidetools { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
body.desk .menu .stb { display: flex; flex-direction: column; align-items: center; gap: 5px; border: 1px solid var(--side-line); background: none; color: var(--side-txt); font: 500 .74rem/1.2 var(--font-body); padding: 9px 4px 8px; border-radius: 9px; cursor: pointer; text-align: center; }
body.desk .menu .stb:hover { background: var(--side-2); color: var(--side-hi); }
body.desk .menu .stb svg { width: 18px; height: 18px; flex: none; }
body.desk .menu .foot { margin-top: 6px; padding: 8px 12px 0; color: var(--side-foot); font-size: .68rem; line-height: 1.45; }
/* barra a destra (scelta dell'utente, salvata in dg-side) */
:root[data-side="r"] body.desk { padding-left: 0; padding-right: var(--sidew); }
:root[data-side="r"] body.desk .menu { left: auto; right: 0; border-right: 0; border-left: 1px solid var(--side-line); }
:root[data-side="r"] body.desk .menu nav button[aria-current="page"]::before { left: auto; right: -14px; border-radius: 3px 0 0 3px; }
/* barra ridotta a sole icone (salvato in dg-sidec) */
:root[data-sidec="1"] body.desk { --sidew: 72px; }
:root[data-sidec="1"] body.desk .menu { padding: 16px 10px; }
:root[data-sidec="1"] body.desk .menu .brandrow { flex-direction: column; gap: 10px; padding-bottom: 10px; }
:root[data-sidec="1"] body.desk .menu .brand { flex: none; padding: 0; }
:root[data-sidec="1"] body.desk .brand span, :root[data-sidec="1"] body.desk .menu nav .lbl, :root[data-sidec="1"] body.desk .menu .stb span, :root[data-sidec="1"] body.desk .menu .foot, :root[data-sidec="1"] body.desk .menu .coll { display: none; }
:root[data-sidec="1"] body.desk .menu nav .grp { font-size: 0; padding: 8px 0 4px; margin: 0 10px; border-top: 1px solid var(--side-line); }
:root[data-sidec="1"] body.desk .menu nav button { justify-content: center; padding: 11px 0; }
:root[data-sidec="1"] body.desk .menu nav .nb { position: absolute; top: 3px; right: 4px; padding: 0 4px; font-size: .58rem; line-height: 1.5; }
:root[data-sidec="1"] body.desk .menu nav button[aria-current="page"]::before { left: -10px; }
:root[data-sidec="1"][data-side="r"] body.desk .menu nav button[aria-current="page"]::before { left: auto; right: -10px; }
:root[data-sidec="1"] body.desk .menu .sidetools { grid-template-columns: 1fr; margin-top: auto; }
:root[data-sidec="1"] body.desk .menu .stb { padding: 10px 0; }

body.desk .bar.empty { display: none; }
body.desk .bar .top { display: none; }
body.desk .bar .wrap { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
body.desk #q { flex: 1 1 380px; width: auto; height: 46px; font-size: 15px; padding: 10px 16px; }

.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 30px 0 12px; }

/* ---- Scansione delle carte con la fotocamera (#scan) */
.scan { position: fixed; inset: 0; z-index: 900; background: #05080f; color: #f1f4f9; display: none; overflow: hidden; font-family: var(--font-body); touch-action: none; overscroll-behavior: contain; }

.scan video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #05080f; opacity: 0; transition: opacity .2s ease-out; }
.scan video.live { opacity: 1; }
.scan .scmask { position: absolute; inset: 0; pointer-events: none; }
.scan .scframe { position: absolute; left: 50%; top: 44%; width: min(72vw, calc(56vh * 63 / 88), 360px); aspect-ratio: 63 / 88; transform: translate(-50%, -50%); border-radius: 18px; box-shadow: 0 0 0 200vmax rgba(5,8,15,.62); pointer-events: none; }
.scframe i { position: absolute; width: 34px; height: 34px; border: 4px solid #ff7a3d; }
.scframe i:nth-child(1) { left: -3px; top: -3px; border-right: 0; border-bottom: 0; border-radius: 18px 0 0 0; }
.scframe i:nth-child(2) { right: -3px; top: -3px; border-left: 0; border-bottom: 0; border-radius: 0 18px 0 0; }
.scframe i:nth-child(3) { left: -3px; bottom: -3px; border-right: 0; border-top: 0; border-radius: 0 0 0 18px; }
.scframe i:nth-child(4) { right: -3px; bottom: -3px; border-left: 0; border-top: 0; border-radius: 0 0 18px 0; }
.scframe b { position: absolute; left: 8%; right: 8%; height: 2px; top: 50%; border-radius: 2px; background: linear-gradient(90deg, transparent, #63d5ee, transparent); box-shadow: 0 0 14px #63d5ee; opacity: 0; }
.scan.run .scframe b { opacity: .9; animation: scline 2.2s ease-in-out infinite; }
@keyframes scline { 0% { top: 6%; } 50% { top: 94%; } 100% { top: 6%; } }
.scan.found .scframe i { border-color: #4ade80; }
.scan.found .scframe b { display: none; }
.schead { position: absolute; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px; display: flex; align-items: center; gap: 10px; background: linear-gradient(rgba(5,8,15,.75), transparent); }

.scfoot { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 22px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; justify-content: space-between; gap: 12px; background: linear-gradient(transparent, rgba(5,8,15,.8)); }

  // ---- Richiesta di conferma nello stile dell'app (sostituisce la finestra di sistema del browser/APK)
  // o = { title, text, ok, onOk }
  function askConfirm(o) {

    var sc = el("div", "upd-scrim cfmscrim"), box = el("div", "cfmbox"), keep = document.activeElement;
    box.setAttribute("role", "alertdialog"); box.setAttribute("aria-modal", "true");

    box.appendChild(h); box.setAttribute("aria-labelledby", "cfm-t");

    function kd(e) { if (e.key === "Escape") { e.stopImmediatePropagation(); e.preventDefault(); close(); } }
    no.onclick = close; ok.onclick = function () { close(); o.onOk(); };

  }

<script>
/* Digital Gate: intro di 1.9 secondi, senza dipendenze e senza richieste di rete. */
(() => {
  'use strict';
  const durations = { normal: 1240, reduced: 180 };
  const sessionKey = 'dg-splash';
  function mount(element, options = {}) {
    if (!element) return null;
    let timer = null, running = false, priorFocus = null;
    const inertStates = new Map();
    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    function release() {
      for (const [node, wasInert] of inertStates) node.inert = wasInert;
      inertStates.clear();
    }
    function finish() {
      if (!running) return;
      running = false;
      clearTimeout(timer);
      element.classList.remove('is-running');
      element.setAttribute('aria-hidden', 'true');
      release();
      if (priorFocus?.isConnected && priorFocus !== document.body) priorFocus.focus({ preventScroll: true });
      element.dispatchEvent(new CustomEvent('digitalgate:bootend', { bubbles: true }));
    }
    function play() {
      clearTimeout(timer);
      if (running) { element.classList.remove('is-running'); release(); }
      priorFocus = document.activeElement;
      element.setAttribute('aria-hidden', 'false');
      if (options.inertTargets) for (const node of options.inertTargets) {
        if (node && !node.contains(element)) { inertStates.set(node, node.inert); node.inert = true; }
      }
      element.classList.remove('is-running');
      void element.offsetWidth;
      running = true;
      element.classList.add('is-running');
      timer = setTimeout(finish, reduced.matches ? durations.reduced : durations.normal);
      return timer;
    }
    const onEscape = e => { if (running && e.key === 'Escape') { e.preventDefault(); finish(); } };
    const onVisibility = () => { if (document.hidden) finish(); };
    const onMotion = () => { if (running && reduced.matches) finish(); };
    // un tap o un clic in qualsiasi punto chiude l'intro (solo 'click': il tocco non passa ai pulsanti sotto)
    element.addEventListener('click', finish);
    document.addEventListener('keydown', onEscape);
    document.addEventListener('visibilitychange', onVisibility);
    reduced.addEventListener('change', onMotion);
    element.setAttribute('aria-hidden', 'true');
    return {
      play, finish,
      get running() { return running; },
      destroy() {
        finish();
        element.removeEventListener('click', finish);
        document.removeEventListener('keydown', onEscape);
        document.removeEventListener('visibilitychange', onVisibility);
        reduced.removeEventListener('change', onMotion);
      },
      startOnce() {
        let seen = false;
        try { seen = sessionStorage.getItem(sessionKey) === '1'; sessionStorage.setItem(sessionKey, '1'); } catch (_) {}
        const skipRequested = new URLSearchParams(location.search).has('nosplash');
        if (!seen && !skipRequested) play();
        return !seen && !skipRequested;
      }
    };
  }
  window.DigitalGateBoot = Object.freeze({ mount, durations });
})();
(function () {
  // una sola intro: sul sito una volta per sessione (dg-splash), nell'APK a ogni avvio; ?nosplash la salta
  var el = document.getElementById("dg-boot"); if (!el || !window.DigitalGateBoot) return;
  var apk = !!window.Capacitor || /^capacitor:/.test(location.protocol);
  var boot = DigitalGateBoot.mount(el, { inertTargets: [document.querySelector(".bar"), document.querySelector("main"), document.getElementById("menu"), document.getElementById("tabbar")].filter(Boolean) });
  if (!boot) return;
  el.addEventListener("digitalgate:bootend", function () { setTimeout(function () { if (!boot.running) el.hidden = true; }, 300); });
  if (apk) { try { sessionStorage.setItem("dg-splash", "1"); } catch (e) {} if (!/[?&]nosplash/.test(location.search)) boot.play(); else el.hidden = true; }
  else if (!boot.startOnce()) el.hidden = true;
  el.classList.remove("is-pending");
})();
</script>
